name: Stage I Python tests

on:
  push:
    branches:
      - master
      - "experiment/**"
  pull_request:
    paths:
      - "experiments/**"
      - ".github/workflows/stage1-tests.yml"

jobs:
  stage1-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run Stage I tests
        run: python -m pytest -q experiments/stage1
